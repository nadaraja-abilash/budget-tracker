<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Budget Tracker</title>

    <link rel="stylesheet" href="budjet.css">
    <link rel="icon" href="logo1.jpeg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<div id="welcomePopup" class="popup">
    <div class="popup-content">
        <h2>Welcome</h2>
        <p>Welcome to <strong>Abilash's</strong> Budget Tracker.</p>
        <p>Track your income and expenses easily.</p>
        <button onclick="closePopup()">Start</button>
    </div>
</div>

<div class="container">

    <header class="site-header">
        <img src="logo1.jpeg" alt="Budget Tracker Logo" class="logo">
        <h1>LashBudget</h1>
    </header>

    <div class="currency-box">
        <label for="currency">Currency</label>
        <select id="currency" onchange="changeCurrency()">
            <option value="₹">INR ₹</option>
            <option value="$">USD $</option>
            <option value="Rs">LKR Rs</option>
        </select>
    </div>

    <div class="summary">
        <div class="card income">
            <h3>Income</h3>
            <p><span class="symbol">₹</span><span id="income">0</span></p>
        </div>

        <div class="card expense">
            <h3>Expense</h3>
            <p><span class="symbol">₹</span><span id="expense">0</span></p>
        </div>

        <div class="card balance">
            <h3>Balance</h3>
            <p><span class="symbol">₹</span><span id="balance">0</span></p>
        </div>
    </div>

    <div class="form">
        <input type="date" id="date">
        <input type="text" id="desc" placeholder="Description">
        <input type="number" id="amount" placeholder="Amount">

        <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
        </select>

        <button onclick="addTransaction()">Add Transaction</button>
    </div>

    <h2>History</h2>
    <ul id="list"></ul>

    <hr>

    <footer>
        <p>&copy; <span id="year"></span> Created by Nadaraja Abilash</p>
    </footer>

</div>

<script>
document.getElementById("year").textContent = new Date().getFullYear();
</script>

<script src="budjet.js"></script>

</body>
</html>
